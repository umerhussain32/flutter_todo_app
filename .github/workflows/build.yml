name: Build Signed Flutter App

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare keystore (uses secrets if set, else auto-generates)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
            STORE_PASS="$KEYSTORE_PASSWORD"
            KPASS="$KEY_PASSWORD"
            ALIAS="$KEY_ALIAS"
          else
            STORE_PASS="android$(openssl rand -hex 8)"
            KPASS="$STORE_PASS"
            ALIAS="upload"
            keytool -genkeypair -v -keystore "$KS" -storetype JKS \
              -keyalg RSA -keysize 2048 -validity 10000 -alias "$ALIAS" \
              -storepass "$STORE_PASS" -keypass "$KPASS" \
              -dname "CN=App, OU=Dev, O=Dev, L=City, ST=State, C=US"
          fi
          echo "KS_FILE=$KS" >> $GITHUB_ENV
          echo "KS_PASS=$STORE_PASS" >> $GITHUB_ENV
          echo "KEY_PASS=$KPASS" >> $GITHUB_ENV
          echo "KS_ALIAS=$ALIAS" >> $GITHUB_ENV

      - name: Upgrade Gradle wrapper
        run: |
          sed -i 's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14-all.zip#' android/gradle/wrapper/gradle-wrapper.properties

      - name: Upgrade Android Gradle Plugin and Kotlin (all gradle files)
        run: |
          find android -maxdepth 2 \( -name "*.gradle" -o -name "*.gradle.kts" \) | while read f; do
            sed -i -E '/com\.android\.application/s/version "[0-9.]+"/version "8.11.1"/' "$f"
            sed -i -E '/kotlin/s/[0-9]+\.[0-9]+\.[0-9]+/2.2.20/g' "$f"
          done
          grep -rnE "com.android.application|kotlin" android --include=*.gradle --include=*.gradle.kts

      - name: Remove deprecated kotlinOptions block
        run: |
          perl -0pi -e 's/kotlinOptions\s*\{[^}]*\}//s' android/app/build.gradle.kts
          sed -n '1,60p' android/app/build.gradle.kts

      - name: Auto-configure Gradle signing (works with .gradle and .gradle.kts)
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/signing.gradle <<'EOF'
          allprojects { p ->
            p.plugins.withId('com.android.application') {
              p.android.signingConfigs {
                ciRelease {
                  storeFile new File(System.getenv('KS_FILE'))
                  storePassword System.getenv('KS_PASS')
                  keyAlias System.getenv('KS_ALIAS')
                  keyPassword System.getenv('KEY_PASS')
                }
              }
              p.afterEvaluate {
                p.android.buildTypes.release.signingConfig = p.android.signingConfigs.ciRelease
              }
            }
          }
          EOF

      - run: flutter pub get
      - run: flutter build apk --release --android-skip-build-dependency-validation
      - run: flutter build appbundle --release --android-skip-build-dependency-validation

      - name: Collect outputs
        run: |
          mkdir out
          cp build/app/outputs/flutter-apk/app-release.apk out/app-release.apk
          cp build/app/outputs/bundle/release/app-release.aab out/app-release.aab

      - uses: actions/upload-artifact@v4
        with:
          name: release-builds
          path: out/*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: out/*
